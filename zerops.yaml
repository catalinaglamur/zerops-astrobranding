zerops:
  - setup: astrobranding
    build:
      base: bun@1.3.9
      os: ubuntu
      buildCommands:
        - bun install
      deployFiles:
        - .
      cache:
        - node_modules
        - ~/.bun/install/cache
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: bun@1.3.9
      os: ubuntu
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        NODE_ENV: production
      start: bun run apps/astrobranding/src/server.ts
      healthCheck:
        httpGet:
          port: 3000
          path: /health
