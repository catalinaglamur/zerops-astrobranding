services:
  # Managed Services (Priority 10)
  - hostname: database
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10

  - hostname: valkey
    type: valkey:single@7.2
    profile: hobby
    priority: 10

  - hostname: nats
    type: nats:single@2.12
    priority: 10

  - hostname: objectstorage
    type: object-storage
    objectStorageSize: 10
    priority: 10

  - hostname: localstorage
    type: local-storage:single@1
    priority: 10

  # Runtimes (Priority 5, startWithoutCode: true for initial provisioning)
  - hostname: astrobranding
    type: ubuntu/bun@1.3.9
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 5

  - hostname: bifrost
    type: alpine/go@1.22
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 5

  - hostname: freellmapi
    type: ubuntu/nodejs@22
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 5

  - hostname: evolution
    type: alpine/go@1.22
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 5

  - hostname: hermes
    type: ubuntu/python@3.12
    startWithoutCode: true
    enableSubdomainAccess: true
    priority: 5
