#zeropsPreprocessor=on
project:
  name: ElPlacerDC
  corePackage: LIGHT

services:
  # 1. Main Web & API Monorepo Service (Astro 5 SSR + Hono on Bun)
  - hostname: astrobranding
    type: bun@1.3.9
    priority: 5
    enableSubdomainAccess: true

  # 2. Managed PostgreSQL 18 Database with pgvector
  - hostname: database
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10

  # 3. Managed Valkey 7.2 In-Memory Cache & Session Store
  - hostname: valkey
    type: valkey:single@7.2
    profile: hobby
    priority: 10

  # 4. Managed NATS Server 2.12 with JetStream
  - hostname: nats
    type: nats:single@2.12
    priority: 10

  # 5. Managed S3-Compatible Object Storage for PDFs and Media
  - hostname: objectstorage
    type: object-storage
    priority: 10

  # 6. Managed POSIX Local Storage Persistent Volume
  - hostname: localstorage
    type: local-storage:single@1
    priority: 10

  # 7. Maxim AI Bifrost Enterprise AI Gateway (Go)
  - hostname: bifrost
    type: go@1.22
    priority: 8
    enableSubdomainAccess: true

  # 8. FreeLLMAPI Multi-Provider Free Inference Proxy (Node.js 22)
  - hostname: freellmapi
    type: nodejs@22
    priority: 8
    enableSubdomainAccess: true

  # 9. EvolutionGo Native WhatsApp Engine (Go)
  - hostname: evolution
    type: go@1.22
    priority: 8
    enableSubdomainAccess: true

  # 10. Nous Research Hermes-Agent Copilot (Python 3.12 Ubuntu)
  - hostname: hermes
    type: python@3.12
    priority: 8
    enableSubdomainAccess: true
